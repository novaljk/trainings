# Example TARS PAI job definition for minimind using GitHub as the code source.
#
# First use the CLI to discover available names:
#   python infra/pai_submit.py list-clusters
#   python infra/pai_submit.py list-images --cluster-name 集群1
#   python infra/pai_submit.py list-gpu-types --cluster-id 1
#   python infra/pai_submit.py list-storages --cluster-name 集群1
#
# Then copy this file to dlc/pai_job.yaml, adjust the image/resources, and run:
#   python infra/pai_submit.py submit --config dlc/pai_job.yaml --dry-run
#   python infra/pai_submit.py submit --config dlc/pai_job.yaml

jobName: minimind-pretrain-20260904-5
clusterName: 集群1
# runId: minimind-20260904-001   # optional output run id; defaults to jobName
priority: 9
podCount: 1
imageName: pytorch:2.6.0-gpu-py310-cu126-ubuntu24.04-accl
specName: NVIDIA-RTX4090
gpuCount: 1
# cpuCount: 16
# resourcePoolName: RTX4090-Group1   # optional; inferred from specName when omitted
# projectName: <project-name>
maxRunTime: 120
errorMonitor: true

# Pull code from the company-internal GitLab at task startup. The training pod
# has SSH access to code.tars-ai.com. Use a local code directory: Git pack
# files are less reliable when placed directly on an OSS/FUSE mount.
source:
  type: git
  url: ssh://git@code.tars-ai.com:2222/qiu.feng/awsome-training.git
  branch: main
  depth: 1
  codeDir: /tmp/minimind/code
  python: python3
  installRequirements: true
  requirementsPath: requirements.txt
  pipIndexUrl: https://mirrors.aliyun.com/pypi/simple

train:
  stage: pretrain               # pretrain or sft
  DATA_ROOT: /mnt/data
  OUT_DIR: /mnt/run/out
  CKPT_DIR: /mnt/run/checkpoints
  RESUME: "1"
  # DATA_PATH: /mnt/data/pretrain_t2t_mini.jsonl
  # EPOCHS: "2"
  # BATCH_SIZE: "32"

# The dataset is uploaded to:
#   oss://tars-data-platform-software/dataset/minimind/
#
# In PAI, this OSS bucket is registered as file storage id 31 on cluster 1.
# Mount the dataset prefix read-only and a unique run prefix read-write.
storageMountList:
  - storageName: tars-data-platform-software
    fileSystemPath: /dataset/minimind/
    mountPath: /mnt/data/
    readOnly: true

  - storageName: tars-data-platform-software
    fileSystemPath: /minimind/runs/minimind-pretrain-20260904/
    mountPath: /mnt/run/
    readOnly: false
